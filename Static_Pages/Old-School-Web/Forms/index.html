<!DOCTYPE html>
<html lang="en">
    <!--Cabecera-->
    
    <head>
        <title>JS-HMTL-CSS</title>
        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width">
        <meta name="author" content="Marco Antonio Ciprian" />
        <meta name="description" content="JS-HTML-CSS Test page." />

        <link rel="Shortcut Icon" href="Resources/placeholder.png" type="image_png_800" />
        <link rel="stylesheet" href="CSS/index.css" />
        <link rel="stylesheet" href="https://tantek.com/log/2004/undohtml.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="Scripts/script.js" defer></script>

    <body>
        <div class="bgImg"></div>
        <div class="notes" >

            <h1 class="headTitle containerH">
                <p class="titleItem">FORMULARY</p>
            </h1>

            <form action="" method="post" class="formContainer containerV">
                <p class="formInfo">CONTACT</p>
                <ul class="formList">
                    <li class="formField containerH">
                        <label class="formLabel" for="name">Nombre:</label>
                        <input class="formInput" type="text" id="name" name="user_name" />
                    </li>
                    <li class="formField containerH">
                        <label class="formLabel" for="mail">Correo:</label>
                        <input class="formInput" type="email" id="mail" name="user_mail" />
                    </li>
                    <li class="formField containerH">
                        <label class="formLabel" for="msg">Mensaje:</label>
                        <textarea class="formInput" id="msg" name="user_msg"></textarea>
                    </li>
                    <li class="formField containerH">
                        <button id="btnSubmit" type="submit">Enviar Mensaje</button>
                    </li>
                </ul>
            </form>

    
        </div>

    </body>

</html>
